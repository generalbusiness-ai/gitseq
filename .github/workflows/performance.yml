name: Performance evidence

on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact base ref
        required: true
        default: main
      candidate:
        description: Exact candidate ref
        required: true
        default: HEAD
      tier:
        description: Bounded contract tier
        required: true
        type: choice
        options:
          - smoke
          - standard
        default: smoke
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the pinned comparison tool
        shell: bash
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d

      - name: Resolve manual comparison refs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PERF_BASE_INPUT: ${{ inputs.base }}
          PERF_CANDIDATE_INPUT: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          resolve_ref() {
            local input=$1
            case "$input" in
              HEAD)
                git rev-parse --verify --end-of-options HEAD^{commit}
                ;;
              *)
                if [[ "$input" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  git rev-parse --verify --end-of-options "$input^{commit}" || return
                  return
                fi
                git check-ref-format "refs/heads/$input" >/dev/null || return
                git fetch --no-tags origin "refs/heads/$input:refs/remotes/origin/$input" || return
                git rev-parse --verify --end-of-options \
                  "refs/remotes/origin/$input^{commit}"
                ;;
            esac
          }
          resolved=$(resolve_ref "$PERF_BASE_INPUT")
          printf 'PERF_BASE=%s\n' "$resolved" >> "$GITHUB_ENV"
          resolved=$(resolve_ref "$PERF_CANDIDATE_INPUT")
          printf 'PERF_CANDIDATE=%s\n' "$resolved" >> "$GITHUB_ENV"

      - name: Run the bounded comparison
        shell: bash
        env:
          PERF_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'smoke' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            PERF_BASE=HEAD^
            PERF_CANDIDATE=HEAD
          fi
          go run ./cmd/gitseq-perf compare \
            --base "$PERF_BASE" \
            --candidate "$PERF_CANDIDATE" \
            --tier "$PERF_TIER" \
            --output performance/evidence

      - name: Retain raw evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance/evidence/
          retention-days: 30
          if-no-files-found: error
