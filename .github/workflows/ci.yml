name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out the candidate without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The preview verifier publishes this exact history to a local fixture.
          fetch-depth: 0

      - name: Install the Go version declared by the module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the locked UI dependencies
        run: npm ci --prefix ui

      - name: Check Go code
        run: |
          make vet
          make test
          make race
          make build

      # ui-check, not ui. Both rebuild the bundle, but only ui-check compares
      # the result against what is committed. The reproducibility gate below
      # cannot cover this: Vite emits content-hashed filenames, so a rebuilt
      # bundle lands as a NEW untracked file, and git diff --exit-code does not
      # look at untracked files. A head whose committed embed did not match its
      # UI source passed CI green, and gs serve would have shipped the stale
      # bundle rather than the reviewed source.
      - name: Check and build the UI
        run: |
          npm test --prefix ui
          make ui-check

      - name: Regenerate the adversarial evidence
        run: make spike

      # The run-specific evidence under spike/.spike/ is where a red run explains
      # itself: which case failed, or which package the runner died in. Without
      # this it lives on the runner until the job ends and is then deleted, so a
      # failure nobody watched live can never be reconstructed. Uploaded only on
      # failure, because a passing run's evidence adds nothing a reader cannot
      # regenerate. Thirty days is chosen rather than inherited: these files
      # describe adversarial security cases, so they are worth keeping long
      # enough to compare a repeat against its predecessor, and not worth
      # keeping indefinitely on a public runner.
      - name: Keep the adversarial evidence from a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adversarial-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: spike/.spike/
          retention-days: 30
          if-no-files-found: warn

      - name: Require reproducible tracked output
        run: git diff --exit-code

      - name: Verify the documented install from a main-only clone
        run: .github/scripts/verify-preview-clone.sh
