name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out the candidate without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Go version declared by the module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the locked UI dependencies
        run: npm ci --prefix ui

      - name: Check Go code
        run: |
          make vet
          make test
          make race
          make build

      - name: Check and build the UI
        run: |
          npm test --prefix ui
          make ui

      - name: Regenerate the adversarial evidence
        run: make spike

      - name: Require reproducible tracked output
        run: git diff --exit-code

      - name: Verify the documented install from a main-only clone
        run: .github/scripts/verify-preview-clone.sh
